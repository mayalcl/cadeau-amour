<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un petit cadeau ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff1f5,#f8e8ff);color:#333}
.card{width:min(92vw,520px);background:#fff;border-radius:26px;padding:32px 24px;text-align:center;box-shadow:0 12px 40px #0002}
.heart{font-size:42px}h1{margin:8px 0 10px;font-size:29px}p{color:#666;line-height:1.5}
input{width:100%;padding:14px 16px;border:1px solid #ddd;border-radius:13px;font-size:17px;margin:12px 0}
button{border:0;border-radius:13px;padding:14px 24px;font-size:16px;background:#e85b87;color:white;cursor:pointer}
.error{color:#c62828;min-height:24px;margin-top:10px}.hidden{display:none}
.video{position:relative;width:100%;padding-top:56.25%;margin-top:20px;border-radius:16px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.small{font-size:13px;color:#999;margin-top:18px}
</style>
</head>
<body><main class="card">
<section id="lock"><div class="heart">❤️</div><h1>J’ai quelque chose pour toi…</h1>
<p>Entre le petit code pour découvrir ton cadeau.</p>
<input id="code" type="password" placeholder="Le code" autocomplete="off">
<button id="open">Découvrir ❤️</button><div class="error" id="error"></div></section>
<section id="gift" class="hidden"><div class="heart">💌</div><h1>Pour toi ❤️</h1>
<p>J’espère que cette petite vidéo te fera sourire.</p>
<div class="video"><iframe src="https://www.youtube.com/embed/0gDuro-yuCU" title="Une vidéo pour toi" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
<p class="small">Avec tout mon amour ❤️</p></section>
</main>
<script>
function unlock(){const c=document.getElementById('code').value;if(c==='amour'){document.getElementById('lock').classList.add('hidden');document.getElementById('gift').classList.remove('hidden')}else document.getElementById('error').textContent='Ce n’est pas le bon code ❤️'}
document.getElementById('open').addEventListener('click',unlock);
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
